# Default values for fid.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

## Global values, shared with subcharts.
##
global:
  ## Registry prefix applied to EVERY image the chart renders (main, init, hooks, tests)
  ## that does not set its own `registry`. Set this to install from a mirror, a private
  ## registry, or an airgapped environment without overriding each image individually.
  ## e.g. imageRegistry: "123456789012.dkr.ecr.us-west-2.amazonaws.com"
  ##
  imageRegistry: ""
  ## Pull secrets merged into every pod the chart renders, in addition to .Values.imagePullSecrets.
  ##
  imagePullSecrets: []

## Labels and annotations added to every object the chart renders.
## Both are purely additive — leaving them empty changes nothing.
##
commonLabels: {}
commonAnnotations: {}

replicaCount: 1
image:
  repository: radiantone/fid
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  ## Optional. Pin by digest instead of tag. When set, this WINS over `tag`.
  ## e.g. digest: "sha256:002ac4c24f9bc131b0..."
  ##
  digest: ""
  ## Optional per-image registry override. Falls back to global.imageRegistry.
  ##
  registry: ""

## Extra containers appended to the FID pod (sidecars the chart does not model).
## Rendered through `tpl`, so values and release metadata may be referenced.
##
# extraContainers:
#   - name: my-sidecar
#     image: busybox:1.36
#     command: ["sh","-c","sleep infinity"]
extraContainers: []

## Arbitrary extra manifests attached to this release. Each entry may be a mapping or a
## string; both are rendered through `tpl`.
##
## This is the object-level escape hatch: ServiceMonitor, ExternalSecret, VPA, extra
## Services or PVCs — anything the chart does not model — without forking it.
##
# extraObjects:
#   - apiVersion: monitoring.coreos.com/v1
#     kind: ServiceMonitor
#     metadata:
#       name: "{{ include \"fid.fullname\" . }}"
#     spec:
#       selector:
#         matchLabels: {app.kubernetes.io/instance: "{{ .Release.Name }}"}
#       endpoints: [{port: exporter}]
extraObjects: []

## Mount the ServiceAccount token into the FID pod.
##
## Left unset by default, so Kubernetes applies its own default (true) and the rendered
## pod spec is unchanged. The hardened and paranoid profiles default it to false: FID
## never calls the Kubernetes API, only the hook Jobs do, and they use their own account.
##
## An explicit value here always wins, including forcing it back to true under hardened.
##
# automountServiceAccountToken: false

## NetworkPolicy for the FID pods.
##
## enabled is tri-state:
##   unset  follow the security profile — on for hardened/paranoid, off otherwise
##   true   always render
##   false  never render, whatever the profile says
##
## The default policy allows ingress to the FID ports from pods in this release (so
## FID-to-FID and ZooKeeper traffic keeps working). Egress is unrestricted unless you set
## it: FID needs DNS, ZooKeeper and every backend your virtual view federates, and
## guessing that set wrong fails in ways that are hard to diagnose.
##
## IMPORTANT — enforcement is a cluster property, not a chart one. Creating a
## NetworkPolicy object does nothing unless the CNI enforces it:
##   - EKS with the AWS VPC CNI needs the node agent started with
##     `--enable-network-policy=true` (check:
##     kubectl -n kube-system get ds aws-node -o jsonpath='{..args}')
##     With it false, the object is accepted by the API server and silently ignored.
##   - Calico, Cilium, Antrea and Weave enforce by default.
## Verify on your cluster before relying on this for isolation.
##
networkPolicy:
  # enabled: true
  ## Extra `from` selectors added to the default ingress rule, e.g. your ingress controller:
  # extraIngressFrom:
  #   - namespaceSelector:
  #       matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
  extraIngressFrom: []
  ## Replace the default ingress rules entirely:
  # ingress:
  #   - from: [{podSelector: {}}]
  #     ports: [{port: 2389, protocol: TCP}]
  ##
  ## Add egress restrictions (setting this adds Egress to policyTypes):
  # egress:
  #   - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
  #     ports: [{port: 53, protocol: UDP}]
  #   - to: [{podSelector: {matchLabels: {app: zookeeper}}}]
  #     ports: [{port: 2181, protocol: TCP}]

## ---------------------------------------------------------------------------------------
## INGRESS / EXTERNAL ACCESS
## ---------------------------------------------------------------------------------------
##
## One block drives NGINX, Traefik and Istio. Enable a controller with true/false, give it
## a hostname, and the same `routes` map is used by whichever you pick — switching
## controller does not mean redescribing your topology.
##
## The legacy `ingress:`, `gateway:` and `virtualservice:` blocks further down still work
## and are untouched. Use `networking:` for anything new.
##
## Ports, for reference:
##   HTTP   7070/7171  Classic Control Panel   -> <release>-ext
##          8089/8090  FID REST / HTTP API     -> <release>-app
##          9100/9101  Admin REST service      -> <release>-admin
##   TCP    2389       LDAP                    -> <release>-app   (exposed as 389)
##          2636       LDAPS                   -> <release>-app   (exposed as 636)
##
networking:
  ## Primary hostname for all HTTP routes. Required when any controller is enabled —
  ## the chart fails the render rather than emitting a host-less rule that would swallow
  ## every request reaching the controller.
  hostname: ""
  extraHostnames: []

  tls:
    enabled: false
    ## Pre-created TLS secret. For Istio this is the gateway `credentialName` and must live
    ## in the istio-ingress namespace, NOT this release's namespace.
    secretName: ""

  ## HTTP routes. Add your own entries freely — anything with
  ## {enabled, path, service, port} renders. controlPanel/api/admin have built-in defaults
  ## so you only need `enabled: true`.
  ##
  ## `order` controls match precedence (lower first). Controllers match in declaration
  ## order, so specific paths must precede "/". Defaults already do this.
  routes:
    controlPanel:
      enabled: true
      # path: /
      # order: 30
    api:
      enabled: false
      # path: /rest-service
      # order: 10
    admin:
      enabled: false
      # path: /admin-service
      # order: 20
    ## Example of an extra route (service + port are required for unknown names):
    # custom:
    #   enabled: true
    #   path: /my-app
    #   service: my-service
    #   port: 8080
    #   order: 5

  ## LDAPS exposed on 636, forwarded to FID's 2636.
  ##
  ## TLS is PASSED THROUGH, not terminated at the edge: FID presents its own directory
  ## certificate. Terminating at the ingress breaks certificate-based (SASL EXTERNAL)
  ## client authentication, which is the usual reason for exposing LDAPS at all.
  ldaps:
    enabled: false
    exposedPort: 636
    targetPort: 2636
    # hostSNI: "*"          # traefik only; "*" also matches clients that send no SNI
    # tlsPassthrough: true  # traefik only

  ## Plain LDAP on 389 -> 2389. Off by default: unencrypted directory traffic.
  ldap:
    enabled: false
    exposedPort: 389
    targetPort: 2389

  nginx:
    enabled: false
    ingressClassName: nginx
    ## Set when a route targets a TLS port (7171/8090/9101); without it nginx speaks HTTP
    ## to an HTTPS upstream and you get 502s.
    backendProtocolHTTPS: false
    annotations: {}
      # nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      # cert-manager.io/cluster-issuer: letsencrypt-prod
    ## Raw TCP in ingress-nginx comes from a ConfigMap in the CONTROLLER's namespace
    ## (--tcp-services-configmap), not this release's.
    ##
    ## manageConfigMap: true makes this chart write it. Leave it false unless this release
    ## is the only thing managing that ConfigMap — ingress-nginx honours exactly one, so
    ## two charts writing it will clobber each other. You must ALSO publish the port on the
    ## controller's Service; a ConfigMap entry alone does nothing.
    tcp:
      manageConfigMap: false
      controllerNamespace: ingress-nginx
      configMapName: tcp-services

  traefik:
    enabled: false
    ## These entryPoints must already exist on your Traefik install — ports are declared
    ## there, not here. The chart cannot create them.
    entryPoints:
      web: web
      websecure: websecure
      ldaps: ldaps
      ldap: ldap
    annotations: {}
    middlewares: []          # e.g. [redirect-https, rate-limit]
    # certResolver: letsencrypt
    # serversTransport: insecure-transport   # for self-signed FID certs on HTTPS upstreams

  istio:
    enabled: false
    selector:
      istio: ingressgateway
    httpPort: 80
    httpsPort: 443
    httpsRedirect: true
    tlsMode: SIMPLE
    # timeout: 60s
    # retries: {attempts: 3, perTryTimeout: 10s}

## ---------------------------------------------------------------------------------------
## EXTERNAL SECRETS OPERATOR (ESO) SHIM
## ---------------------------------------------------------------------------------------
##
## Materialise FID's credentials from a vault or cloud secrets manager instead of putting
## them in values.yaml. Works with any ESO provider: AWS Secrets Manager, HashiCorp Vault,
## OpenBao, GCP Secret Manager, Azure Key Vault, Conjur, Infisical.
##
## Requires the External Secrets Operator to be installed in the cluster.
##
## USAGE — two settings make the swap:
##   externalSecret.enabled: true          renders the ExternalSecret
##   fid.existingSecret: rootcreds-<rel>   makes FID consume it (chart renders no Secret)
## The default target name is exactly what the chart's own Secret would be called, so those
## two line up automatically.
##
## KEYS (five on this chart line, verified live):
##   fid-root-username  fid-root-password  fid-license  zk-username  zk-password
## `zk-username` is the one people forget; omitting it breaks ZooKeeper auth in a way that
## looks like an unrelated startup failure.
##
## ORDERING: ESO writes the Secret asynchronously, so on a fresh install FID may restart a
## few times until it appears. That is expected, not a failure.
##
externalSecret:
  enabled: false
  # apiVersion: external-secrets.io/v1beta1   # use .../v1 on newer ESO
  # name: ""                                  # defaults to <release>-fid-credentials
  refreshInterval: 1h
  secretStoreRef:
    name: ""                                  # REQUIRED when enabled
    kind: SecretStore                         # or ClusterSecretStore
  target:
    # name: ""                                # defaults to rootcreds-<release>
    creationPolicy: Owner
    deletionPolicy: Retain
  ## SIMPLEST FORM: one remote secret whose properties are named exactly as FID expects.
  # remoteKey: "fid/prod/credentials"
  ##
  ## EXPLICIT MAPPING: use when external key names differ from FID's (the common case).
  # data:
  #   - secretKey: fid-root-password
  #     remoteRef: {key: prod/fid, property: rootPassword}
  #   - secretKey: zk-username
  #     remoteRef: {key: prod/fid, property: zkUser}
  ##
  ## PULL EVERYTHING from one external secret (keys must already match):
  # dataFrom:
  #   - extract: {key: fid/prod/credentials}

## Preflight checks.
##
## Render-time guards that stop an install or upgrade which would otherwise fail in a
## confusing way. Each can be switched off individually — a check you cannot bypass is a
## restriction, and this chart does not restrict.
##
##   mountSecretsVersionCheck  fid.mountSecrets: true with a pre-8.0.0 image tag. A 7.x
##                             image cannot read mounted secret files, so FID starts
##                             without credentials and never becomes ready.
##   immutableFieldCheck       an upgrade that would change the StatefulSet's selector or
##                             volumeClaimTemplates. Kubernetes rejects both in place, so
##                             the upgrade would fail half-applied. The error explains the
##                             --cascade=orphan recovery.
##   storageClassCheck         persistence.storageClass names a class that does not exist
##                             in the cluster, which leaves PVCs Pending forever.
##
## The last two use `lookup`, so they are inert during `helm template` and `--dry-run`.
##
preflight:
  mountSecretsVersionCheck: true
  immutableFieldCheck: true
  storageClassCheck: true

## PodDisruptionBudget for the main FID StatefulSet.
##
## Rendered by default with maxUnavailable: 1, which is what this chart has always produced.
##
## WHEN TO DISABLE: on a single-replica install a PDB gives you nothing and actively hurts —
## it can block `kubectl drain` and stop cluster-autoscaler from reclaiming an idle node.
## WHEN TO USE minAvailable INSTEAD: when you care about how many nodes stay up rather than
## how many may go down, e.g. minAvailable: 2 on a 3-replica cluster guarantees quorum
## through a rolling node replacement.
##
## Set only ONE of maxUnavailable / minAvailable — minAvailable wins if both are set.
##
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  # minAvailable: 2

## Fallback resources for helper containers that do not set their own
## `helperImages.<name>.resources`. Also the single knob for changing them all at once.
##
helperResources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

## Fallback securityContext for helper containers that do not set their own
## `helperImages.<name>.securityContext`. Empty by default (historical behaviour).
## The `hardened` security profile populates this.
##
helperSecurityContext: {}

## Resources for the lifecycle hook Jobs and the migration CronJob.
## Empty by default, which reproduces the historical templates (no resources block at all).
##
## Set this if your namespace enforces a LimitRange or ResourceQuota — without it the
## hook Jobs are rejected at admission and the install/upgrade fails.
## e.g. hookResources: {limits: {cpu: 100m, memory: 128Mi}, requests: {cpu: 50m, memory: 64Mi}}
##
hookResources: {}

## Images for the chart's helper containers.
##
## Previously these were hardcoded in the templates, which made mirrored/airgapped installs
## impossible and pinned every install to whatever ":latest" happened to be that day.
## The defaults below reproduce the historical references EXACTLY, so upgrading the chart
## changes nothing until you override something here.
##
## Each entry accepts: registry, repository, tag, digest, pullPolicy.
## Setting `digest` wins over `tag`. Setting `tag: ""` renders a bare, untagged reference.
##
## Recommendation for production: pin every one of these by digest.
##
## FIRST-PARTY HELPER IMAGES
##
## These default to RadiantOne's own images, matching helm-v8, rather than upstream
## alpine/busybox. Benefits: one vendor to patch for CVEs, no Docker Hub anonymous
## rate-limit exposure, and predictable contents.
##
## All verified PUBLIC (anonymous pull, no regcred needed) and tool-verified on a live
## cluster:
##   radiantone/init-tools:latest  nc at /usr/bin/nc, runs as uid 65532 (nonroot)
##   radiantone/curl:latest        curl + grep at /usr/bin, runs as uid 0
##   radiantone/kubectl:latest     kubectl at /opt/bitnami/kubectl/bin, uid 1001
##   busybox:latest                Docker Official (kept for sysctl, as helm-v8 does)
##
## NOTE: adopting these changes the rendered pod template, so the first upgrade after
## taking this chart version performs a rolling restart. Set the repositories back to
## alpine / alpine/curl / busybox if you need to avoid that.
##
helperImages:
  ## Init container that waits for ZooKeeper's TCP port (fid + follower StatefulSets).
  ## Needs `nc`.
  checkZk:
    repository: radiantone/init-tools
    tag: latest
    pullPolicy: IfNotPresent
    resources:
      limits: {cpu: 100m, memory: 128Mi}
      requests: {cpu: 100m, memory: 128Mi}
  ## Init container that waits for ZooKeeper to leave read-only mode (fid StatefulSet).
  ## Needs `curl` and `grep`.
  checkZkReadonly:
    repository: radiantone/curl
    tag: latest
    pullPolicy: IfNotPresent
    resources:
      limits: {cpu: 100m, memory: 128Mi}
      requests: {cpu: 100m, memory: 128Mi}
  ## Init container that waits for the FID leader to be reachable (follower StatefulSet).
  ## Needs `nc`.
  checkFid:
    repository: radiantone/init-tools
    tag: latest
    pullPolicy: IfNotPresent
    resources:
      limits: {cpu: 100m, memory: 128Mi}
      requests: {cpu: 100m, memory: 128Mi}
  ## Privileged init container that raises vm.max_map_count (only when sysctl.enabled).
  ## NOTE: this one runs privileged by necessity — it writes a kernel parameter.
  ## Its securityContext is set in the template, not here, so that nulling
  ## helperSecurityContext cannot silently drop the privilege it needs to function.
  sysctl:
    repository: busybox
    tag: latest
    pullPolicy: IfNotPresent
    resources:
      limits: {cpu: 100m, memory: 128Mi}
      requests: {cpu: 100m, memory: 128Mi}
  ## Init container that downloads and applies fid.migration.url.
  ## Needs `curl`.
  migration:
    repository: radiantone/curl
    tag: latest
    pullPolicy: IfNotPresent
    resources:
      limits: {cpu: 100m, memory: 512Mi}
      requests: {cpu: 100m, memory: 128Mi}
  ## Job image for the lifecycle hooks (pre/post install, upgrade, delete, rollback)
  ## and for the migration CronJob. Historically untagged, hence tag: "".
  ## Hook Jobs and the migration CronJob. radiantone/kubectl ships kubectl, which is what
  ## the commented-out hook scripts try to curl down at runtime - use it instead of
  ## downloading a binary inside a hook.
  hooks:
    repository: radiantone/kubectl
    tag: latest
  ## Images used by `helm test` pods.
  testCurl:
    repository: radiantone/curl
    tag: latest
  testBusybox:
    repository: busybox
    tag: ""
fid:
  ## FID root user name
  ## Default values cn=Directory Manager
  rootUser: "cn=Directory Manager"
  ## Password for FID root user
  ##
  rootPassword: "Welcome1234"
  ## License for FID
  ##
  license: "[FID Cluster License]"
  ## Detach from cluster on termination
  ##
  detach: false
  ## Deploy a readonly sts, that joins an existing FID cluster
  ##
  readonly: false
  migration:
  ## Migration file that will be imported during first install (export.zip)
  # url: https://raw.githubusercontent.com/radiantlogic-devops/docker-compose/master/05-monitoring-stack/configs/fid/export.zip
    url:
  ## Post migration script to be run after install (configure_fid.sh)
    script:
  ## Bring your own credentials Secret instead of letting the chart create one.
  ##
  ## When set, the chart renders NO Secret and every consumer (env secretKeyRef and the
  ## mounted-secret volume) points at the name given here. This is the hook for External
  ## Secrets Operator, Sealed Secrets, the Vault CSI driver, or a hand-made Secret.
  ##
  ## The Secret must provide these keys:
  ##   fid-root-username, fid-root-password, zk-username, zk-password, fid-license
  ##
  # existingSecret: "fid-credentials"
  existingSecret: ""

  ## Keep the chart-managed Secret when the release is uninstalled
  ## (adds helm.sh/resource-policy: keep).
  ##
  ## WHEN TO ENABLE: a delete/reinstall cycle otherwise mints new credentials, which strands
  ## a ZooKeeper ensemble whose ACLs still reference the old ones. Note that a kept Secret
  ## must be deleted by hand before the namespace can be fully cleaned up.
  ##
  retainSecret: false

  # Mount the secrets by default instead of passing them as env variables. Works on for fid image 8.0.0 or higher
  # Mount secrets should be set to "false" in versions lower than "8.x.x"
  mountSecrets: true
  # Set sealedSecrets id using sealedSecrets
  sealedSecrets: false
  ## Deploy a readonly/follower-only sts, that joins current FID cluster
  ##
  followerOnly:
    enabled: false
    # Enable this with caution
    autoscaling:
      enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    ## Detach from cluster on termination
    detach: true

  ## Probes.
  ##
  ## Every field below is the value this chart has always rendered. periodSeconds,
  ## failureThreshold and successThreshold used to be hardcoded in the template with no way
  ## to change them; they are surfaced here so you can tune them without forking the chart.
  ##
  ## WHEN TO RAISE THESE: FID can block for a long time during a large Lucene index commit
  ## or a full GC on the leader. While blocked it stops answering the liveness exec probe,
  ## kubelet kills the container (exit 137 — looks like an OOM, but is not) and the cluster
  ## re-elects, turning a slow operation into an outage. If you run large branches or see
  ## unexplained restarts under load, raise timeoutSeconds first, then failureThreshold.
  ##
  livenessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 5
    periodSeconds: 30
    failureThreshold: 5
    successThreshold: 1
    ## Replace the liveness command entirely, e.g. to point at a different check binary:
    # command: ["/opt/radiantone/check", "run", "-type", "liveness"]
    ##
    ## Suggested where index commits are known to stall 30s or more:
    # timeoutSeconds: 30
    # failureThreshold: 10
  readinessProbe:
    initialDelaySeconds: 120
    timeoutSeconds: 5
    periodSeconds: 30
    failureThreshold: 5
    successThreshold: 1
    ## LDAPS port dialled by the readiness TCP check.
    # port: 2636

  ## Startup probe. DISABLED by default — the chart has never rendered one, and turning it
  ## on changes the pod template, which means a rolling restart.
  ##
  ## WHEN TO ENABLE: a startup probe gives FID a long, generous window to come up
  ## (failureThreshold x periodSeconds) WITHOUT slackening the liveness probe that protects
  ## it for the rest of its life. This is the right fix for "FID gets killed while still
  ## loading a large dataset" — much better than inflating livenessProbe.initialDelaySeconds,
  ## which weakens the probe permanently.
  ##
  ## The defaults below give 15 x 20s = 5 minutes of startup grace.
  ##
  startupProbe:
    enabled: false
    initialDelaySeconds: 0
    timeoutSeconds: 5
    periodSeconds: 20
    failureThreshold: 15
    # command: ["/opt/radiantone/check", "run", "-type", "liveness"]
# zookeeper configuration
# zookeeper is set to external by default
zk:
  external: true
  connectionString: "zookeeper-app:2181"
  clusterName: "fid-cluster"
  ruok: "http://zookeeper-app:8080/commands/ruok"
  userName: "admin"
  password: "secret1234"
sysctl:
  enabled: false
imagePullSecrets: []
# imagePullSecrets:
# - name: regcred
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
updateStrategy: RollingUpdate
podAnnotations: {}
# Pod level security context
## ---------------------------------------------------------------------------------------
## SECURITY POSTURE
## ---------------------------------------------------------------------------------------
##
## `security.profile` selects a set of securityContext DEFAULTS. It is a dial, not a cage:
## anything you set in podSecurityContext / securityContext / helperSecurityContext below is
## deep-merged ON TOP of the profile and always wins.
##
##   vanilla   (default) No hardening whatsoever — exactly what this chart has always
##                       rendered. A fully supported destination: if you want root and no
##                       restrictions, stay here. Nothing about upgrading changes this.
##   baseline            ~Pod Security Standards "baseline". allowPrivilegeEscalation=false
##                       and RuntimeDefault seccomp. Safe for effectively any workload and
##                       the cheapest meaningful hardening step.
##   hardened            ~PSS "restricted". Non-root (uid 1000), all capabilities dropped,
##                       read-only root filesystem on the init/helper containers.
##                       VALIDATED on FID 7.4.23: pod runs as uid/gid 1000 with
##                       allowPrivilegeEscalation=false, capabilities dropped ALL and
##                       RuntimeDefault seccomp; the cluster forms, the leader is elected
##                       and all bundled fid tests pass, with zero restarts.
##   paranoid            hardened, PLUS a read-only root filesystem on the FID container.
##                       FID writes to /opt/radiantone at runtime, so this REQUIRES writable
##                       volume mounts for every such path. Validate in a test namespace
##                       before production — see extraVolumes / extraVolumeMounts below.
##   custom              No preset at all. You specify every field yourself.
##
## Changing profile alters only mutable pod-template fields, so it is a rolling restart and
## `helm rollback` reverses it exactly.
##
## To REMOVE a field a profile sets (rather than change its value), use profile: custom, or
## fid.podSpecPatch — the patch is applied last and can delete or override anything.
##
## Example — hardened everywhere, but this one image insists on running as uid 0:
##   security:
##     profile: hardened
##   securityContext:
##     runAsUser: 0
##     runAsNonRoot: false
##
security:
  profile: vanilla

## Pod-level security context. Merged over the active profile's pod defaults.
## fsGroup: 1000 is the historical value and makes the mounted PVC group-writable by FID.
##
podSecurityContext:
  fsGroup: 1000
  ## Set explicitly if your storage class needs a different group, or to force a
  ## permissions relabel on every mount (slow on very large volumes):
  # fsGroupChangePolicy: OnRootMismatch
  # runAsUser: 1000
  # runAsGroup: 1000
  # supplementalGroups: [2000]

## Container-level security context for the FID container.
## Merged over the active profile's container defaults. Empty = whatever the profile says.
##
securityContext: {}
  ## The `hardened` profile sets all of the following for you. Set them here only if you
  ## want them on the `vanilla` profile, or want to override what a profile chose.
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true      # see the `paranoid` note above before enabling
  # runAsNonRoot: true
  # runAsUser: 1000
  # allowPrivilegeEscalation: false
  # seccompProfile:
  #   type: RuntimeDefault
# Service type to expose Control Panel service
service:
  type: ClusterIP
  port: 7070
ingress:
  enabled: false
  annotations: {}
  # annotations:
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - "/"
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
# resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
# resources:
#  limits:
#    cpu: 4
#    memory: 8Gi
#  requests:
#    cpu: 2
#    memory: 2Gi
resources:
  limits:
    cpu: 1
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi
# Do not enable this
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
# nodeSelector is the simplest recommended form of node selection constraint.
nodeSelector: {}
# Tolerations allow the scheduler to schedule pods with matching taints.
tolerations: []
# Node affinity is conceptually similar to nodeSelector, allowing you to constrain which nodes your Pod can be scheduled on based on node labels.
affinity: {}
## Enable persistence using Persistent Volume Claims
## ref: http://kubernetes.io/docs/user-guide/persistent-volumes/
##
persistence:
  enabled: false
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ##   set, choosing the default provisioner.  (gp2 on AWS, azure-disk on
  ##   Azure, standard on GKE, AWS & OpenStack)
  ##
  ## Accepts:
  ##   "auto"     pick the best class present in the cluster (see below)
  ##   "-"        no class at all — disables dynamic provisioning
  ##   ""         omit the field, letting the cluster's default class apply
  ##   <name>     use that class verbatim
  ##
  ## NOTE ON THE DEFAULT: "default" is a class NAME, not an instruction to use the cluster
  ## default. Most clusters (EKS, GKE, kind) have no class called "default", so PVCs stay
  ## Pending with no obvious cause. AKS is the exception — it really does ship one.
  ## The preflight storageClassCheck catches this before you hit it.
  ##
  ## "auto" ranks what actually exists, best first: encrypted+expandable+default, then
  ## encrypted+expandable, then expandable+default, then expandable, then default.
  ## Encryption is inferred from the class name or its parameters, since Kubernetes has no
  ## portable field for it. Verified on a live EKS cluster: picks `encrypted-gp3`
  ## (encrypted, expandable) over `gp3` (cluster default but unencrypted).
  ##
  ## `lookup` is inert during `helm template`/`--dry-run`, so an offline render of "auto"
  ## omits the field. Use `--dry-run=server` to see what it will actually choose.
  ##
  # storageClass: "-"
  # storageClass: "auto"
  storageClass: "default"
  accessModes:
  - ReadWriteOnce
  size: 10Gi
  annotations: {}

## Metrics and Logging for VDS
# Persisitence need to be enabled to enabled both logging or metrics
# Fluentd needs to be set to true to enable logging
# For splunk, to provide source, sourcetype, input them under aggregators.
# For splunk, to provide, custom source, sourcetype, index, use individual logs (splunk_index,splunk_source, splunk_sourcetype)
# Aggregators, Logs and key:value pairs for logs and aggregators can be added dynamically
# custom_index can be provided for each log individually and it takes precedence
## =======================================================================================
## OBSERVABILITY (new)  —  supersedes `metrics:` when enabled
## =======================================================================================
##
## A single block for the next-generation exporter (rl-exporter by default) plus the full
## helm-v8 logging model: NAMED aggregators, per-log retention, and eight output types
## (elasticsearch, opensearch, splunk_hec, loki, sumologic, s3, azure_event_hubs,
## opentelemetry) with SSL/TLS options.
##
## PRECEDENCE: when observability.enabled is true, this block drives the exporter sidecar
## and the legacy `metrics:` block below is IGNORED. When false (the default) nothing here
## renders and the chart behaves exactly as it always has via `metrics:`.
##
## STATUS: the metrics path is live today; the logging path is wired to the correct contract
## (a generated fluent.conf mounted into the sidecar, exactly as helm-v8 does) but depends on
## the rl-exporter image being ready on this FID line — see docs/07. Everything renders and
## validates now; log shipping lights up when the image does.
##
observability:
  enabled: false

  ## The exporter sidecar. Defaults to rl-exporter (pull-native, serves :9095, no Pushgateway).
  exporter:
    ## fid-exporter | rl-exporter. Drives the image default, the container command and the
    ## env surface, just like metrics.flavor — but here rl-exporter is the default.
    flavor: rl-exporter
    ## Empty => derived from flavor (radiantone/rl-exporter). Override for a mirror or the
    ## current dev build (rahulnutakki/rl-exporter:dev).
    imageRepository: ""
    tag: ""
    # digest: ""
    # registry: ""
    # pullPolicy: IfNotPresent
    metricsPort: 9095
    ## Admin REST API rl-exporter scrapes for FID metrics. Defaults to the pod's admin HTTPS.
    # adminApiUrl: "https://localhost:9101"
    # zkConn: "zookeeper-app:2181"
    securityContext:
      runAsUser: 0
    resources:
      limits:   {cpu: 1000m, memory: 512Mi}
      requests: {cpu: 100m,  memory: 128Mi}
    annotations: {}

  ## Automatically create Kibana index patterns / ES ILM policies for the indices below.
  indexCreation:
    enabled: false
    rbac:
      enabled: false
    kibana:
      scheme: "http"
      host: "kibana.mycompany.local"
      port: "5601"
      # user: ""
      # password: ""

  ## Full helm-v8 logging model.
  logging:
    enabled: false
    annotations:
      enabled: false
      config: {}
    fluentd:
      enabled: false
      posFileDirectory: "/opt/radiantone/vds/work/logging"
      configFile: /fluentd/etc/fluent.conf

      ## Log sources. Each: enabled, path, index, retention_days, aggregators (by NAME),
      ## optional custom_index / splunk_* / parse / shards / replicas / refresh_interval.
      logs:
        vds_server:
          enabled: true
          path: "/opt/radiantone/vds/vds_server/logs/vds_server.log"
          index: vds_server.log
          retention_days: 30
          aggregators: ["default"]
        vds_server_access:
          enabled: true
          path: "/opt/radiantone/vds/vds_server/logs/vds_server_access.csv"
          index: vds_server_access.log
          retention_days: 30
          aggregators: ["default"]
          parse: |-
            <parse>
              @type tsv
              keys LOGID,LOGDATE,LOGTIME,LOGTYPE,SERVERID,SERVERPORT,SESSIONID,MSGID,CLIENTIP,BINDDN,BINDUSER,CONNNB,OPNB,OPCODE,OPNAME,BASEDN,ATTRIBUTES,SCOPE,FILTER,SIZELIMIT,TIMELIMIT,LDAPCONTROLS,CHANGES,RESULTCODE,ERRORMESSAGE,MATCHEDDN,NBENTRIES,ETIME
              types LOGID:integer,LOGDATE:string,LOGTIME:string,LOGTYPE:integer,SERVERID:string,SERVERPORT:integer,SESSIONID:integer,MSGID:integer,CLIENTIP:string,BINDDN:string,BINDUSER:string,CONNNB:integer,OPNB:integer,OPCODE:integer,OPNAME:string,BASEDN:string,ATTRIBUTES:string,SCOPE:string,FILTER:string,SIZELIMIT:integer,TIMELIMIT:integer,LDAPCONTROLS:string,CHANGES:string,RESULTCODE:integer,ERRORMESSAGE:string,MATCHEDDN:string,NBENTRIES:integer,ETIME:integer
            </parse>
        vds_events:
          enabled: true
          path: "/opt/radiantone/vds/vds_server/logs/vds_events.log"
          index: vds_events.log
          retention_days: 30
          aggregators: ["default"]
        periodiccache:
          enabled: true
          path: "/opt/radiantone/vds/vds_server/logs/periodiccache.log"
          index: periodiccache.log
          retention_days: 30
          aggregators: ["default"]
        web:
          enabled: true
          path: "/opt/radiantone/vds/vds_server/logs/jetty/web.log"
          index: web.log
          retention_days: 30
          aggregators: ["default"]
        web_access:
          enabled: true
          path: "/opt/radiantone/vds/vds_server/logs/jetty/web_access.log"
          index: web_access.log
          retention_days: 30
          aggregators: ["default"]
        sync_engine:
          enabled: true
          path: "/opt/radiantone/vds/vds_server/logs/sync_engine/sync_engine.log"
          index: sync_engine.log
          retention_days: 30
          aggregators: ["default"]
        alerts:
          enabled: true
          path: "/opt/radiantone/vds/logs/alerts.log"
          index: alerts.log
          retention_days: 30
          aggregators: ["default"]
        adap_access:
          enabled: true
          path: "/opt/radiantone/vds/vds_server/logs/adap_access.log"
          index: adap_access.log
          retention_days: 30
          aggregators: ["default"]
        admin_rest_api_access:
          enabled: true
          path: "/opt/radiantone/vds/vds_server/logs/admin_rest_api_access.log"
          index: admin_rest_api_access.log
          retention_days: 30
          aggregators: ["default"]
        connector:
          enabled: true
          path: "/opt/radiantone/vds/logs/sync_agents/*/connector.log"
          index: connector.log
          retention_days: 30
          aggregators: ["default"]

      ## NAMED aggregators. Each log references these by name in its `aggregators: [...]`.
      ## Supported types: elasticsearch, opensearch, splunk_hec, loki, sumologic, s3,
      ## azure_event_hubs, opentelemetry. Only the default is active; the rest are examples.
      aggregators:
        - name: "default"
          type: "elasticsearch"
          host: "elasticsearch-master.common-services.svc.cluster.local"
          port: "9200"
          # scheme: "https"
          # user: "elastic"
          # password: "changeme"
          # ssl: {verify: false}
          # ca_file: "/path/to/ca.pem"
          # client_cert: "/path/to/client-cert.pem"
        # - name: "opensearch-prod"
        #   type: "opensearch"
        #   host: "opensearch-cluster-master.svc.cluster.local"
        #   port: "9200"
        #   scheme: "https"
        #   ssl: {verify: true}
        # - name: "splunk-prod"
        #   type: "splunk_hec"
        #   hec_host: "splunk-service.svc.cluster.local"
        #   hec_port: "8088"
        #   hec_token: "YOUR-HEC-TOKEN"
        #   protocol: "https"
        #   index: "myindex"
        #   sourcetype: "_json"
        # - name: "loki-prod"
        #   type: "loki"
        #   username: "fid-service"
        #   password: "LOKI_PASSWORD"
        #   ssl: {verify: true}
        # - name: "sumo-prod"
        #   type: "sumologic"
        #   endpoint: "https://collectors.us2.sumologic.com/receiver/v1/http/COLLECTOR_ID"
        #   compress: true
        # - name: "s3-archive"
        #   type: "s3"
        #   region: "us-west-2"
        #   path: "logs/%Y/%m/%d/"
        #   store_as: "gzip"
        # - name: "azure-events"
        #   type: "azure_event_hubs"
        #   connection_string: "Endpoint=sb://<ns>.servicebus.windows.net/;SharedAccessKeyName=<policy>;SharedAccessKey=<key>"
        #   hub_name: "fid-logs"
        # - name: "otel-collector"
        #   type: "opentelemetry"
        #   endpoint: "http://otel-collector.monitoring.svc.cluster.local:4317"
        #   protocol: "grpc"

## ---------------------------------------------------------------------------------------
## METRICS / LOGGING SIDECAR (legacy — used only when observability.enabled is false)
## ---------------------------------------------------------------------------------------
## METRICS / LOGGING SIDECAR
##
## Despite the name, this sidecar runs BOTH a metrics exporter and Fluentd. The container
## is called "fid-exporter" for historical reasons; when metrics.fluentd.enabled is true it
## is Fluentd doing the work, which is why it is the container that OOMs, not FID.
##
## EXPORTER FLAVOUR
##   fid-exporter  (default) radiantone/fid-exporter - the shipping exporter. PUBLIC.
##   rl-exporter             radiantone/rl-exporter - the first-party successor that folds
##                           fid-exporter + zk-exporter + metrics-service into one image,
##                           reads metrics from the Admin REST API instead of LDAP
##                           cn=Monitor, and fixes the OOM with per-worker on-disk buffers.
##
## rl-exporter is NOT the default yet for one concrete reason: as of this chart version its
## image is not published to a public registry (ghcr.io/radiantlogic-devops/rl-exporter
## returns 403 and there is no Docker Hub repo), so defaulting to it would break every
## install that cannot authenticate. Flip to it with:
##
##   metrics:
##     flavor: rl-exporter
##     imageRepository: ghcr.io/radiantlogic-devops/rl-exporter   # or wherever you publish
##     tag: <version>
##     resources: {limits: {memory: 512Mi}}   # 128Mi is not enough for rl-exporter
##
## When rl-exporter is published publicly, change `flavor` below to rl-exporter and the
## repository default in _helpers.tpl (fid.metricsImage) to match.
##
## PUSH vs PULL — verified against radiantone/fid-exporter:iddm-8.4.5 on a live cluster.
##
## `pushMode` does more than pick a transport: it decides whether the exporter binary runs
## AT ALL. The image's entrypoint starts it only when PUSH_MODE=true.
##
##   pushMode: false  ->  no exporter process, nothing listens on :9095, and there is
##                        nothing for Prometheus to scrape. Metrics are simply off.
##   pushMode: true   ->  the exporter runs, serves :9095 locally, AND a cron pushes to
##                        pushGateway every pushMetricCron.
##
## You CAN scrape :9095 directly with Prometheus (verified: 65 series served there), but
## read the warning below first — you still need a reachable pushGateway.
##
## ⚠️  A PUSHGATEWAY OUTAGE SILENTLY KILLS LOG SHIPPING.
##
## The image's entrypoint runs `verify_pushgateway || exit 1` BEFORE it starts Fluentd. If
## pushGateway is unreachable the entrypoint blocks there and never reaches the logging
## block, so Fluentd never starts — with no error in the container logs saying so. The
## container stays Running and Ready the whole time.
##
## Proven on a live cluster: with the gateway deleted, 0 fluentd processes and no indices;
## with it restored, 5 fluentd processes, 8 files tailed and 1,013 documents shipped —
## same values, same chart, only the gateway's reachability changed.
##
## So if you enable pushMode you must keep a Pushgateway reachable, even when you intend to
## scrape :9095 instead of using it. To run logging WITHOUT that coupling, set
## pushMode: false — Fluentd then starts unconditionally, and you get no metrics.
##
## Prometheus' own guidance is that a Pushgateway is the wrong shape for long-lived
## services: it breaks up/down detection and staleness. Prefer scraping :9095.
##
## Verified both paths: 70 FID metric series (ldap_connection, ldap_connection_count,
## ldap_connection_max, ...) reached a Pushgateway within one cron interval, and 65 series
## were readable directly from :9095 at the same time.
##
## To scrape with the Prometheus Operator, add a ServiceMonitor via extraObjects — the
## chart does not render one (see docs/07-metrics-and-logging.md).
##
metrics:
  enabled: false
  ## fid-exporter | rl-exporter
  ##
  ## The flavour drives BOTH the image default and how the sidecar is wired:
  ##   fid-exporter  radiantone/fid-exporter, push-mode metrics + shell-orchestrated Fluentd
  ##   rl-exporter   radiantone/rl-exporter, a single Go binary that serves :9095 for
  ##                 scraping and ships logs directly (no Pushgateway, no pushgateway gate)
  ##
  ## Leave imageRepository empty to let the flavour pick the repository. Set it to override
  ## (e.g. a mirror, or rahulnutakki/rl-exporter for the current dev build).
  flavor: fid-exporter
  ## Empty => derived from flavor. Preferred key; `image`/`imageTag` still work (deprecated).
  imageRepository: ""
  ## Pinned to an immutable tag rather than `latest`, which silently rolled a new Fluentd
  ## into every pod restart. iddm-8.4.5 verified PUBLIC.
  tag: iddm-8.4.5
  # digest: "sha256:..."     # pin harder for production
  # registry: ""             # falls back to global.imageRegistry
  # pullPolicy: IfNotPresent
  securityContext:
    runAsUser: 0
  ## The 1Gi limit was hardcoded in the template. This sidecar buffers logs, so a slow or
  ## unreachable Elasticsearch makes it grow until the kernel kills it - taking the whole
  ## pod's restart count with it. Raise this before blaming FID.
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  annotations: {}
  ## rl-exporter only. The Admin REST API endpoint it scrapes for FID metrics. Defaults to
  ## the pod's own admin HTTPS port. On FID 7.x these paths 404 (rl-exporter targets 8.x).
  # adminApiUrl: "https://localhost:9101"
  ## rl-exporter only. Port it serves /metrics on for Prometheus to scrape.
  # metricsPort: 9095
  ## rl-exporter only. ZooKeeper connection for its ZK collector.
  # zkConn: "zookeeper-app:2181"
  ##
  ## ------ fid-exporter only, below ------
  pushMode: true
  pushGateway: http://prometheus-server:9091
  pushMetricCron: "* * * * *"
  fluentd:
    enabled: false
    logs:
      vds_server:
        enabled: true
        path: "/opt/radiantone/vds/vds_server/logs/vds_server.log"
        index: vds_server.log
        # custom_index: vds_server_testing.log
        # splunk_index: vds_server_splunk_testing.log
        # splunk_source: testingsource
        # splunk_sourcetype: testingsourcetype
      vds_server_access:
        enabled: true
        path: "/opt/radiantone/vds/vds_server/logs/vds_server_access.csv"
        index: vds_server_access.log
        # custom_index:
        # splunk_index:
        # splunk_source:
        # splunk_sourcetype:
        parse: |-
          <parse>
            @type tsv
            keys LOGID,LOGDATE,LOGTIME,LOGTYPE,SERVERID,SERVERPORT,SESSIONID,MSGID,CLIENTIP,BINDDN,BINDUSER,CONNNB,OPNB,OPCODE,OPNAME,BASEDN,ATTRIBUTES,SCOPE,FILTER,SIZELIMIT,TIMELIMIT,LDAPCONTROLS,CHANGES,RESULTCODE,ERRORMESSAGE,MATCHEDDN,NBENTRIES,ETIME
            types LOGID:integer,LOGDATE:string,LOGTIME:string,LOGTYPE:integer,SERVERID:string,SERVERPORT:integer,SESSIONID:integer,MSGID:integer,CLIENTIP:string,BINDDN:string,BINDUSER:string,CONNNB:integer,OPNB:integer,OPCODE:integer,OPNAME:string,BASEDN:string,ATTRIBUTES:string,SCOPE:string,FILTER:string,SIZELIMIT:integer,TIMELIMIT:integer,LDAPCONTROLS:string,CHANGES:string,RESULTCODE:integer,ERRORMESSAGE:string,MATCHEDDN:string,NBENTRIES:integer,ETIME:integer
          </parse>
      vds_events:
        enabled: true
        path: "/opt/radiantone/vds/vds_server/logs/vds_events.log"
        index: vds_events.log
        # custom_index:
        # splunk_index:
        # splunk_source:
        # splunk_sourcetype:
      periodiccache:
        enabled: true
        path: "/opt/radiantone/vds/vds_server/logs/periodiccache.log"
        index: periodiccache.log
        # custom_index:
        # splunk_index:
        # splunk_source
        # splunk_sourcetype
      web:
        enabled: true
        path: "/opt/radiantone/vds/vds_server/logs/jetty//web.log"
        index: web.log
        # custom_index:
        # splunk_index:
        # splunk_source
        # splunk_sourcetype
      web_access:
        enabled: true
        path: "/opt/radiantone/vds/vds_server/logs/jetty/web_access.log"
        index: web_access.log
        # custom_index:
        # splunk_index:
        # splunk_source
        # splunk_sourcetype
      sync_engine:
        enabled: true
        path: "/opt/radiantone/vds/vds_server/logs/sync_engine.log"
        index: sync_engine.log
        # custom_index:
        # splunk_index:
        # splunk_source
        # splunk_sourcetype
      alerts:
        enabled: true
        path: "/opt/radiantone/vds/vds_server/logs/alerts.log"
        index: alerts.log
        # custom_index:
        # splunk_index:
        # splunk_source
        # splunk_sourcetype
      adap_access:
        enabled: true
        path: "/opt/radiantone/vds/vds_server/logs/adap_access.log"
        index: adap_access.log
        # custom_index:
        # splunk_index:
        # splunk_source
        # splunk_sourcetype
      admin_rest_api_access:
        enabled: true
        path: "/opt/radiantone/vds/vds_server/logs/admin_rest_api_access.log"
        index: admin_rest_api_access.log
        # custom_index:
        # splunk_index:
        # splunk_source
        # splunk_sourcetype
    configFile: /fluentd/etc/fluent.conf
    aggregators: []
      # - type: "elasticsearch"
      #   host: "elasticsearch-master"
      #   port: "9200"
      # - name: "elastic-prod"
      #   type: "elasticsearch"
      #   host: "elasticsearch-master"
      #   port: "9200"
      #   scheme: "https"
      #   user: "xxxx"
      #   password: "xxxx"
      # - type: "opensearch"
      #   host: "opensearch-cluster-master"
      #   port: "9200"
      #   user: "admin"
      #   password: "admin"
      # - name: "opensearch-prod"
      #   type: "opensearch"
      #   host: "opensearch-cluster-master"
      #   port: "9200"
      #   scheme: "https"
      #   user: "xxxx"
      #   password: "xxxx"
      # - type: "splunk_hec"
      #   hec_host: "splunk-s1-standalone-service.splunk-operator.svc.cluster.local"
      #   hec_port: "8088"
      #   hec_token: ""
      #   source: ""
      #   sourcetype: "*"
      #   insecure_ssl: "true"
        # hec_index: ""
  livenessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 5
  readinessProbe:
    initialDelaySeconds: 120
    timeoutSeconds: 5

