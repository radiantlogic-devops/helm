# Headless service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fid.fullname" . }}-headless
  labels:
    {{- include "fid.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}{{ toYaml . | nindent 4 }}{{- end }}
    app.kubernetes.io/core-name: {{ include "fid.name" . }}
spec:
  ports:
    - port: 9100
      name: admin-http
    - port: 9101
      name: admin-https
    - port: 2389
      name: ldap
    - port: 2636
      name: ldaps
  selector:
    app.kubernetes.io/core-name: {{ include "fid.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  type: ClusterIP
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "fid.fullname" . }}
  labels:
    {{- include "fid.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}{{ toYaml . | nindent 4 }}{{- end }}
    app.kubernetes.io/core-name: {{ include "fid.name" . }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  serviceName: {{ template "fid.fullname" . }}-headless
  updateStrategy:
    type: {{ .Values.updateStrategy | default "RollingUpdate" }}
  selector:
    matchLabels:
    {{- include "fid.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/core-name: {{ include "fid.name" . }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/fluentd-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 6 }}
        {{- end }}
      labels:
      {{- include "fid.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/core-name: {{ include "fid.name" . }}
    spec:
      {{- include "fid.preflight" . }}
      {{- /* Render the pod spec, then deep-merge fid.podSpecPatch over it. The patch is the
           chart's escape hatch: it can set any field, including ones the chart does not model. */}}
      {{- $podSpec := fromYaml (include "fid.podSpec" .) }}
      {{- if not $podSpec }}{{ fail "fid.podSpec rendered invalid YAML - chart bug" }}{{- end }}
      {{- include "fid.applyPatch" (dict "base" $podSpec "patch" (.Values.fid).podSpecPatch) | nindent 6 }}
{{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: r1-pvc
      annotations:
      {{- range $key, $value := .Values.persistence.annotations }}
        {{ $key }}: {{ $value }}
      {{- end }}
      labels:
        {{- include "fid.labels" . | nindent 8 }}
        {{- with .Values.commonLabels }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      accessModes:
      {{- range .Values.persistence.accessModes }}
      - {{ . | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size | quote }}
      {{- /* "auto" resolves to the best class in the cluster; see fid.storageClass. */}}
      {{- $sc := include "fid.storageClass" . }}
      {{- if $sc }}
      {{- if (eq "-" $sc) }}
      storageClassName: ""
      {{- else }}
      storageClassName: "{{ $sc }}"
      {{- end }}
      {{- end }}
{{- end }}
