apiVersion: v1
data:
  {{- if .Values.zk.external }}
  ZK: "external"
  {{- end }}
  ZK_CONN_STR: {{ .Values.zk.connectionString | quote }} #this should match the service name from zk deployment
  ZK_CLUSTER: {{ .Values.zk.clusterName | quote }}
  {{- if .Values.fid.readonly }}
  NODE_TYPE: "follower"
  {{- end }}
kind: ConfigMap
metadata:
  name: {{ template "fid.fullname" . }}
  {{- /* `metadata` carried two separate `labels:` keys. That is invalid YAML: strict
         parsers reject it, and lenient ones (including the Kubernetes API server) keep
         only the last, so `role: fid` was silently dropped on every install. Merged
         here, which restores it. ConfigMap labels are not selectors, so adding it back
         has no effect on matching or immutability. */}}
  labels:
    role: fid
    app: {{ template "fid.fullname" . }}
    chart: "{{ template "fid.chart" . }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    {{- with .Values.commonLabels }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  
