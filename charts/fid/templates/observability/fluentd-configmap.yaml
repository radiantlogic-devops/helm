{{- /*
Fluentd config for the observability sidecar (the new, rl-exporter-oriented path).

Ported from helm-v8's logging/fluentd-configmap.yaml, but reads .Values.observability.logging
instead of .Values.logging, gates on observability.enabled, and uses fid.labels (this chart
has no Bitnami common subchart). The aggregator-rendering helpers in _fluentd-helpers.tpl are
used verbatim.

Named a distinct ConfigMap (<fullname>-observability-fluentd) so it never collides with the
legacy metrics: path's `fluentd-config`.
*/ -}}
{{- if and ((.Values.observability).enabled) (((.Values.observability).logging).fluentd).enabled }}
{{- $clusterName := .Values.zk.clusterName | default "fid-cluster" }}
{{- $globalCtx := . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fid.fullname" . }}-observability-fluentd
  labels:
    {{- include "fid.labels" . | nindent 4 }}
    app.kubernetes.io/core-name: {{ include "fid.name" . }}
    {{- with .Values.commonLabels }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  fluent.conf: |
    # =====================================================================
    # Fluentd Configuration (observability path)
    # Generated by Helm from templates/observability/fluentd-configmap.yaml
    #
    # Tails and parses the logs under observability.logging.fluentd.logs and
    # forwards them to the named aggregators under
    # observability.logging.fluentd.aggregators. Aggregators are validated and
    # rendered by the helper templates in _fluentd-helpers.tpl.
    #
    # clusterName: {{ $clusterName }}
    # =====================================================================

    # Build aggregator dictionary from the array in values
    {{- $aggList := .Values.observability.logging.fluentd.aggregators | default list }}
    {{- $aggMap := dict }}
    {{- range $agg := $aggList }}
      {{- if kindIs "map" $agg }}
        {{- $name := toString $agg.name }}
        {{- $existing := index $aggMap $name | default (list) }}
        {{- $newList := append $existing $agg }}
        {{- $_ := set $aggMap $name $newList }}
      {{- end }}
    {{- end }}

    # Process logs
    {{- $logs := .Values.observability.logging.fluentd.logs | default dict }}
    {{- range $logName, $val := $logs }}
      {{- if $val.enabled }}
        {{- include "fid.fluentd.source" (dict "val" $val "logName" $logName "posFileDirectory" $.Values.observability.logging.fluentd.posFileDirectory "context" $globalCtx) | nindent 8 }}
        {{- include "fid.fluentd.filter" (dict "val" $val "logName" $logName "clusterName" $clusterName "context" $globalCtx) | nindent 8 }}
        {{- include "fid.fluentd.match" (dict "val" $val "logName" $logName "aggregatorsList" $aggMap "clusterName" $clusterName "context" $globalCtx) | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
