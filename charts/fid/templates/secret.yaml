{{- /*
Chart-managed credentials Secret.

Skipped entirely when fid.existingSecret is set (bring your own Secret — External Secrets
Operator, Sealed Secrets, Vault CSI, or one you created by hand) or when sealedSecrets is on.

CREDENTIAL PRESERVATION
-----------------------
Each key resolves in this order:

  1. the explicit value in values.yaml, if set
  2. the value already present in the live Secret, looked up in-cluster
  3. a freshly generated random value  (first install only)

Step 2 is what stops `helm upgrade` from silently rotating credentials. Previously the
fallback was a bare `randAlphaNum 12`, which is re-evaluated on EVERY render: any upgrade
performed without fid.rootPassword / zk.password set would mint new credentials and write
them over the working ones, while the running pods kept using the old values until their
next restart.

`lookup` returns an empty result during `helm template`, `--dry-run` and `helm lint`, so
rendering offline still produces a random value exactly as before.
*/ -}}
{{- if and (not .Values.fid.existingSecret) (not .Values.fid.sealedSecrets) (not .Values.sealedSecrets) }}
{{- $name := printf "rootcreds-%s" (include "fid.fullname" .) }}
{{- $live := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $liveData := $live.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app: {{ template "fid.fullname" . }}
    chart: "{{ template "fid.chart" . }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    {{- include "fid.commonLabels" . | nindent 4 }}
  {{- /* Only emit the annotations key when there is something to put in it, so the
         default render is unchanged. fid.retainSecret opts in to keeping the Secret on
         uninstall, so a delete/reinstall cycle does not strand a cluster whose ZooKeeper
         ACLs still reference the old credentials. */}}
  {{- if or .Values.fid.retainSecret .Values.commonAnnotations }}
  annotations:
    {{- if .Values.fid.retainSecret }}
    "helm.sh/resource-policy": keep
    {{- end }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
type: Opaque
data:
  {{- if .Values.fid.rootUser }}
  fid-root-username: {{ .Values.fid.rootUser | b64enc | quote }}
  {{- end }}
  {{- if .Values.fid.rootPassword }}
  fid-root-password: {{ .Values.fid.rootPassword | b64enc | quote }}
  {{- else if index $liveData "fid-root-password" }}
  fid-root-password: {{ index $liveData "fid-root-password" | quote }}
  {{- else }}
  fid-root-password: {{ randAlphaNum 12 | b64enc | quote }}
  {{- end }}
  {{- if .Values.zk.userName }}
  zk-username: {{ .Values.zk.userName | b64enc | quote }}
  {{- end }}
  {{- if .Values.zk.password }}
  zk-password: {{ .Values.zk.password | b64enc | quote }}
  {{- else if index $liveData "zk-password" }}
  zk-password: {{ index $liveData "zk-password" | quote }}
  {{- else }}
  zk-password: {{ randAlphaNum 12 | b64enc | quote }}
  {{- end }}
  {{- if .Values.fid.license }}
  fid-license: {{ .Values.fid.license | b64enc | quote }}
  {{- else if index $liveData "fid-license" }}
  fid-license: {{ index $liveData "fid-license" | quote }}
  {{- end }}
{{- end }}
