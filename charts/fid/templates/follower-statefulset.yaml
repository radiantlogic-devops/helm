###################################

# This is a statefulset yaml file to deploy follower only nodes in FID cluster.
# To know more about follower only nodes, please refer to product documentation

###################################

{{- if hasKey .Values.fid "followerOnly" }}
{{- if .Values.fid.followerOnly.enabled }}
# Headless service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fid.fullname" . }}-follower
  labels:
    {{- include "fid.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}{{ toYaml . | nindent 4 }}{{- end }}
    app.kubernetes.io/follower-name: {{ include "fid.name" . }}
spec:
  ports:
    - port: 9100
      name: admin-http
    - port: 9101
      name: admin-https
    - port: 2389
      name: ldap
    - port: 2636
      name: ldaps
  selector:
    app.kubernetes.io/follower-name: {{ include "fid.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  type: ClusterIP
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "fid.fullname" . }}-follower
  labels:
    {{- include "fid.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}{{ toYaml . | nindent 4 }}{{- end }}
    app.kubernetes.io/follower-name: {{ include "fid.name" . }}
spec:
  replicas: {{ .Values.fid.followerOnly.minReplicas }}
  serviceName: {{ template "fid.fullname" . }}-follower
  updateStrategy:
    type: {{ .Values.updateStrategy | default "RollingUpdate" }}
  selector:
    matchLabels:
      {{- include "fid.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/follower-name: {{ include "fid.name" . }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "fid.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/follower-name: {{ include "fid.name" . }}
    spec:
      {{- $fpatch := (.Values.fid.followerOnly).podSpecPatch | default (.Values.fid).podSpecPatch }}
      {{- $ps := fromYaml (include "fid.followerPodSpec" .) }}
      {{- if not $ps }}{{ fail "fid.followerPodSpec rendered invalid YAML - chart bug" }}{{- end }}
      {{- include "fid.applyPatch" (dict "base" $ps "patch" $fpatch) | nindent 6 }}
{{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: r1-pvc
      annotations:
      {{- range $key, $value := .Values.persistence.annotations }}
        {{ $key }}: {{ $value }}
      {{- end }}
      labels:
        {{- include "fid.labels" . | nindent 8 }}
        {{- with .Values.commonLabels }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      accessModes:
      {{- range .Values.persistence.accessModes }}
      - {{ . | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size | quote }}
      {{- if .Values.persistence.storageClass }}
      {{- if (eq "-" .Values.persistence.storageClass) }}
      storageClassName: ""
      {{- else }}
      storageClassName: "{{ .Values.persistence.storageClass }}"
      {{- end }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
