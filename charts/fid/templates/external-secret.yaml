{{- /*
External Secrets Operator (ESO) integration shim.

Renders an ExternalSecret that materialises FID's credentials Secret from a vault or cloud
secrets manager — AWS Secrets Manager, HashiCorp Vault, OpenBao, GCP Secret Manager, Azure
Key Vault, CyberArk Conjur, Infisical: anything with an ESO provider.

WHY A REAL SECRET, NOT A FILE MOUNT
-----------------------------------
FID's credentials are consumed by `secretKeyRef` env vars (and, on 8.x, a mounted secret
volume). Both require a genuine Kubernetes Secret object, so a files-only approach such as
the Vault Agent Injector or the CSI driver's file mode cannot replace this. ESO's model —
sync the external value INTO a Secret — is the one that fits.

THE KEY CONTRACT — FIVE KEYS ON THIS CHART LINE
-----------------------------------------------
Verified against a live install of this chart, the Secret carries exactly five keys:

  fid-root-username   fid-root-password   fid-license
  zk-username         zk-password

`zk-username` is the one that gets missed — omit it and ZooKeeper authentication fails in
a way that surfaces as an unrelated startup problem. Do not trim this list.

The v8 chart line carries a SIXTH key, `fid-admin-api-key`, which this chart's FID version
does not use. If you are templating one external secret for both chart lines, include it
there and simply leave it unmapped here (an extra key in the Secret is harmless).
Add it via `externalSecret.data` if you need it.

HOW IT FITS TOGETHER
--------------------
This template only creates the ExternalSecret. To make FID actually use it, point the
chart at the resulting Secret:

  fid:
    existingSecret: "rootcreds-<release>"   # or externalSecret.target.name

The chart then renders no Secret of its own and every consumer resolves to the ESO-managed
one. Set `externalSecret.target.name` to match `fid.existingSecret` — the default below
does this automatically.

ORDERING: ESO writes the Secret asynchronously. On a fresh install the FID pod may start
before the Secret exists and will restart until it appears. `creationPolicy: Owner` plus a
`refreshInterval` is the normal setup; if you need install-time ordering, gate the release
behind ESO's readiness rather than expecting the chart to wait.
*/ -}}
{{- $es := .Values.externalSecret | default dict -}}
{{- if $es.enabled }}
apiVersion: {{ $es.apiVersion | default "external-secrets.io/v1beta1" }}
kind: ExternalSecret
metadata:
  name: {{ $es.name | default (printf "%s-credentials" (include "fid.fullname" .)) }}
  labels:
    {{- include "fid.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- with (mergeOverwrite (dict) ($es.annotations | default dict) (.Values.commonAnnotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required when externalSecret.enabled is true" (($es.secretStoreRef).name) }}
    kind: {{ ($es.secretStoreRef).kind | default "SecretStore" }}
  target:
    {{- /* Defaults to the exact name the chart's own Secret would have had, so setting
           fid.existingSecret to the same value is a drop-in swap. */}}
    name: {{ ($es.target).name | default (printf "rootcreds-%s" (include "fid.fullname" .)) }}
    creationPolicy: {{ ($es.target).creationPolicy | default "Owner" }}
    deletionPolicy: {{ ($es.target).deletionPolicy | default "Retain" }}
    {{- with ($es.target).template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- if $es.dataFrom }}
  {{- /* dataFrom: pull every key from one external secret. Simplest when you control the
         external layout and can name the keys exactly as FID expects. */}}
  dataFrom:
    {{- toYaml $es.dataFrom | nindent 4 }}
  {{- else if $es.data }}
  {{- /* data: map each FID key to its own external key. Use this when the external names
         differ from FID's, which is the common case. */}}
  data:
    {{- toYaml $es.data | nindent 4 }}
  {{- else }}
  {{- /* Neither given: generate the five-key mapping from a single remote key, which is
         the layout most customers start with. */}}
  data:
    {{- $remote := required "externalSecret.remoteKey is required unless externalSecret.data or .dataFrom is set" $es.remoteKey }}
    {{- range $k := (list "fid-root-username" "fid-root-password" "fid-license" "zk-username" "zk-password") }}
    - secretKey: {{ $k }}
      remoteRef:
        key: {{ $remote }}
        property: {{ $k }}
    {{- end }}
  {{- end }}
{{- end }}
