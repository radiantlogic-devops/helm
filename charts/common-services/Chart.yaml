apiVersion: v2
name: common-services
description: A Helm chart for deploying RadiantOne Common Services on Kubernetes

# Chart Type
# ----------
# This is an "application" chart, meaning it bundles together multiple Kubernetes resources to deploy a complete application.
type: application

# Chart Version
# -------------
# This version should be incremented following Semantic Versioning (https://semver.org/) whenever the chart's structure or templates change.
version: 2.1.0

# Application Version (Informational)
# -----------------------------------
# This represents the version of the RadiantOne Common Services software itself, not the Helm chart version.
# Follow Semantic Versioning (https://semver.org/)
appVersion: "2.0"

# Required Kubernetes Version
# --------------------------
# Specifies the minimum Kubernetes version needed for this chart to function correctly.
kubeVersion: ">=1.24.0-0"

# Chart Maintainers (Optional)
# ----------------------------
# List the people or teams responsible for maintaining and supporting this Helm chart.
maintainers:
  - name: pgodey
    email: pgodey@radiantlogic.com
    url: https://www.radiantlogic.com

# Chart Dependencies
# ------------------
# List the Helm charts that this chart depends on to function.  Each dependency includes:
#   - name: The name of the dependency chart.
#   - version: The version of the dependency chart to use.
#   - repository: The Helm repository where the dependency chart can be found.
#   - condition: A conditional expression that determines whether the dependency is to be enabled or not.
dependencies:
- name: argo-cd
  version: 7.8.0
  # version: 5.6.0
  repository: https://argoproj.github.io/argo-helm
  condition: argo-cd.enabled
- name: prometheus
  # app v2.43.0 -> v2.55.1 (final 2.x LTS). NOTE: helm upgrade fails on the immutable
  # StatefulSet selector — delete the prometheus-server STS (PVC retained) then re-upgrade.
  version: 25.30.1
  repository: https://prometheus-community.github.io/helm-charts
  condition: prometheus.enabled
- name: grafana
  # chart repo moved grafana.github.io -> grafana-community (grafana.github.io stopped
  # publishing the grafana chart after 2026-01-30). app 11.5.1 -> 12.4.3.
  version: 11.6.1
  repository: https://grafana-community.github.io/helm-charts
  condition: grafana.enabled
- name: elasticsearch
  # chart frozen at 8.5.1 (elastic/helm-charts archived); app driven via imageTag 8.19.16.
  # 8.x defaults security ON — values.yaml sets it OFF to match the 7.17 posture.
  version: 8.5.1
  repository: https://helm.elastic.co
  condition: elasticsearch.enabled
- name: kibana
  # locked to the elasticsearch version; chart frozen at 8.5.1, app via imageTag 8.19.16.
  # requires the elasticsearch-master-certs + kibana-es-token secrets (see values.yaml).
  version: 8.5.1
  repository: https://helm.elastic.co
  condition: kibana.enabled
- name: haproxy
  version: 1.24.0
  # version: 1.17.3
  repository: https://haproxytech.github.io/helm-charts
  condition: haproxy.enabled
- name: postgresql
  version: 12.1.3
  repository: https://charts.bitnami.com/bitnami
  condition: postgresql.enabled
- name: zookeeper
  version: 11.0.0
  repository: https://charts.bitnami.com/bitnami
  condition: zookeeper.enabled
- name: pgadmin4
  version: 1.13.8
  repository: https://helm.runix.net
  condition: pgadmin4.enabled
- name: opensearch
  # app 2.11.0 -> 2.19.5 (stay on 2.x / Lucene 9 — engine StatefulSet upgrades IN PLACE,
  # data retained, no reindex). NOTE: the pinned prometheus-exporter plugin in values.yaml
  # MUST be bumped to the matching app version (2.19.5.0) or the engine CrashLoops on start.
  # 2.19.x is also the required stepping stone for any future 3.x jump.
  version: 2.37.0
  repository: https://opensearch-project.github.io/helm-charts
  condition: opensearch.enabled
- name: opensearch-dashboards
  # chart 2.33.0 -> app 2.19.5, matching the engine exactly (chart number != app version here).
  # Dashboards must equal the engine major.minor (and be <= it). NOTE: the Deployment selector
  # changed vs 2.14.0, so helm upgrade fails 'field is immutable' — delete the
  # opensearch-dashboards Deployment (stateless) then re-upgrade.
  version: 2.33.0
  repository: https://opensearch-project.github.io/helm-charts
  condition: opensearch-dashboards.enabled
- name: fluent-bit
  # app 3.2.1 -> 4.0.3 (single 3.x->4.x boundary; classic .conf still accepted).
  version: 0.49.1
  repository: https://fluent.github.io/helm-charts
  condition: fluent-bit.enabled
- name: velero
  version: 10.1.2
  repository: https://vmware-tanzu.github.io/helm-charts
  condition: velero.enabled
- name: cloudnative-pg
  repository: https://cloudnative-pg.github.io/charts
  version: 0.28.0
  condition: cloudnative-pg.enabled
- name: velero-ui
  version: 0.x.x
  repository: https://helm.otwld.com
  condition: velero-ui.enabled
- name: nebula-operator
  version: 1.8.6
  repository: https://vesoft-inc.github.io/nebula-operator/charts
  condition: nebula-operator.enabled
- name: flink-kubernetes-operator
  version: 1.14.0
  repository: https://downloads.apache.org/flink/flink-kubernetes-operator-1.14.0
  condition: flink-kubernetes-operator.enabled
- name: loki
  repository: https://grafana.github.io/helm-charts
  version: 6.40.0
  condition: loki.enabled
- name: alloy
  repository: https://grafana.github.io/helm-charts
  version: 1.2.1
  condition: alloy.enabled
- name: prometheus-elasticsearch-exporter
  version: 6.6.0
  repository: https://prometheus-community.github.io/helm-charts
  condition: prometheus-elasticsearch-exporter.enabled
