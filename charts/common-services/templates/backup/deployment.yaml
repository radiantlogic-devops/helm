{{- if and .Values.velero.enabled .Values.backupManager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-manager
  labels:
    {{- include "common-services.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backupManager.replicas }}
  selector:
    matchLabels:
      {{- include "backup-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      name: backup-manager
      labels:
        {{- include "backup-manager.selectorLabels" . | nindent 8 }}
      {{- with .Values.backupManager.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: backup-manager-sa
      {{- with .Values.backupManager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.backupManager.podSecurityContext | nindent 8 }}
      {{- with .Values.backupManager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backupManager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backupManager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: backup-manager-config
      containers:
        - name: velero-api
          image: {{ .Values.backupManager.image.repository }}:{{ .Values.backupManager.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.backupManager.image.pullPolicy }}
          {{- with .Values.backupManager.securityContext }}
          securityContext:
            {{- toYaml .Values.backupManager.securityContext | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backupManager.service.containerPort | default 8080 }}
          resources:
            {{- toYaml .Values.backupManager.resources | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
          env:
            - name: LISTEN_PORT
              value: {{ .Values.backupManager.service.containerPort | default 8080 | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.backupManager.log.format | default "json" | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.backupManager.log.level | default "info" | quote }}
            - name: DEV_MODE
              value: "false"
            - name: VELERO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APPLICATIONS_CONFIG
              value: /etc/config/applications.json
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            {{- $webhook := (.Values.backupManager).webhook | default dict }}
            {{- $webhookBackup := $webhook.backup | default dict }}
            {{- $webhookRestore := $webhook.restore | default dict }}
            - name: WEBHOOK_ENABLED
              value: {{ $webhook.enabled | default false | quote }}
            - name: WATCH_SYNC_PERIOD
              value: {{ $webhook.syncPeriod | default "1m" | quote }}
            - name: BACKUP_WEBHOOK_URL
              value: {{ $webhookBackup.url | default "" | quote }}
            - name: BACKUP_WAIT_TIMEOUT
              value: {{ $webhookBackup.timeout | default "1h" | quote }}
            - name: RESTORE_WEBHOOK_URL
              value: {{ $webhookRestore.url | default "" | quote }}
            - name: RESTORE_WAIT_TIMEOUT
              value: {{ $webhookRestore.timeout | default "1h" | quote }}
            - name: PODS_WAIT_TIMEOUT
              value: {{ .Values.backupManager.podsWaitTimeout | default "5m" | quote }}
            {{- range $key, $value := .Values.backupManager.env }}
            - name: {{ $key | upper | quote }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 1
            httpGet:
              scheme: HTTP
              path: /probes/healthz
              port: {{ .Values.backupManager.service.containerPort | default 8080 }}
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 1
            httpGet:
              scheme: HTTP
              path: /probes/readyz
              port: {{ .Values.backupManager.service.containerPort | default 8080 }}
{{- end }}
