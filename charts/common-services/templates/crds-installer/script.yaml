apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common-services.name" . }}-crds-installer-scripts
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded,BeforeHookCreation
data:  
  install-crds.sh: |
    #!/bin/sh

    set -euo pipefail
    
    # Cleanup function
    cleanup() {
      echo "🧹 Cleaning up temporary files..."
      rm -f /tmp/*_rendered.yaml /tmp/*_crds.yaml
      echo
    }
    
    # Trap to ensure cleanup on exit
    trap cleanup EXIT

    # Remove finalizers from a resource if present (best-effort).
    # Usage: strip_finalizers <kubectl-resource-args...>
    #   e.g. strip_finalizers crd my.crd.io
    #        strip_finalizers nebulaclusters.apps.nebula-graph.io my-cluster -n myns
    strip_finalizers() {
      if kubectl get "$@" -o jsonpath='{.metadata.finalizers}' 2>/dev/null | grep -q .; then
        kubectl patch "$@" --type=json -p='[{"op":"remove","path":"/metadata/finalizers"}]' >/dev/null 2>&1 || true
      fi
    }

    # Forced cleanup: delete all CR instances for matching CRDs, then delete the CRDs.
    # Idempotent / non-fail-closed: existing CRs are purged, absence is a no-op.
    cleanup_crds() {
      local name=$1
      local crd_pattern=$2

      echo "🗑️  === Cleaning up CRDs for $name ==="
      echo "   ℹ️  CRD Pattern: $crd_pattern"

      local crds
      crds=$(kubectl get crd -o name 2>/dev/null | grep -E "$crd_pattern" || true)

      if [ -z "$crds" ]; then
        echo "✅ No CRDs matching $crd_pattern — nothing to clean up"
        echo
        return 0
      fi

      for crd in $crds; do
        local crd_name plural group scope
        crd_name=${crd#customresourcedefinition.apiextensions.k8s.io/}
        echo "🔍 Processing CRD $crd_name..."

        plural=$(kubectl get "$crd" -o jsonpath='{.spec.names.plural}' 2>/dev/null || true)
        group=$(kubectl get "$crd" -o jsonpath='{.spec.group}' 2>/dev/null || true)
        scope=$(kubectl get "$crd" -o jsonpath='{.spec.scope}' 2>/dev/null || true)

        if [ -n "$plural" ] && [ -n "$group" ]; then
          local api="$plural.$group"
          echo "🧹 Deleting all instances of $api (scope=$scope)..."

          if [ "$scope" = "Namespaced" ]; then
            kubectl get "$api" -A -o json 2>/dev/null \
              | jq -r '.items[]? | "\(.metadata.namespace)\t\(.metadata.name)"' \
              | while IFS="$(printf '\t')" read -r ns inst; do
                  [ -z "${inst:-}" ] && continue
                  echo "   → deleting $api/$inst (ns=$ns)"
                  kubectl delete "$api" "$inst" -n "$ns" --wait=false --timeout=30s 2>/dev/null || true
                  strip_finalizers "$api" "$inst" -n "$ns"
                  kubectl delete "$api" "$inst" -n "$ns" --wait=false --timeout=30s --force --grace-period=0 2>/dev/null || true
                done
          else
            kubectl get "$api" -o json 2>/dev/null \
              | jq -r '.items[]? | .metadata.name' \
              | while read -r inst; do
                  [ -z "${inst:-}" ] && continue
                  echo "   → deleting $api/$inst"
                  kubectl delete "$api" "$inst" --wait=false --timeout=30s 2>/dev/null || true
                  strip_finalizers "$api" "$inst"
                  kubectl delete "$api" "$inst" --wait=false --timeout=30s --force --grace-period=0 2>/dev/null || true
                done
          fi
        else
          echo "   ⚠️  Could not resolve plural/group for $crd_name — skipping instance purge"
        fi

        echo "🗑️  Deleting CRD $crd_name..."
        strip_finalizers crd "$crd_name"
        kubectl delete crd "$crd_name" --wait=false --timeout=60s 2>/dev/null || true
        strip_finalizers crd "$crd_name"
        kubectl delete crd "$crd_name" --wait=false --timeout=30s --force --grace-period=0 2>/dev/null || true
        echo "✅ CRD $crd_name cleanup attempted"
      done

      echo "✅ === $name CRD cleanup completed ==="
      echo
    }

    # Function to install CRDs for a given chart
    install_crds() {
      local name=$1
      local repository=$2
      local version=$3
      local crd_pattern=$4
      local chart_name=$5

      echo "🚀 === Installing CRDs for $name ==="
      echo "   ℹ️  Repository: $repository"
      echo "   ℹ️  Version: $version"
      echo "   ℹ️  CRD Pattern: $crd_pattern"
      echo "   ℹ️  Chart Name: $chart_name"
      
      # Add repository
      echo "⬇️ Adding $name repository..."
      helm repo add "$name" "$repository" >/dev/null 2>&1
      
      # Update repositories
      echo "🔄 Updating helm repositories..."
      helm repo update >/dev/null 2>&1
      
      # Render CRDs
      echo "⚙️ Rendering $name CRDs version $version..."
      helm template "$name" "$name/$chart_name" --include-crds --version "$version" > "/tmp/${name}_rendered.yaml"
      
      # Filter CRDs
      echo "🔍 Filtering $name CRDs..."
      yq e 'select(.kind == "CustomResourceDefinition")' "/tmp/${name}_rendered.yaml" > "/tmp/${name}_crds.yaml"
      
      # Remove last-applied-configuration annotation
      echo "🧹  Removing 'last-applied-configuration' annotation from existing CRDs..."
      for crd in $(kubectl get crd -o name | grep "$crd_pattern" || true); do
        kubectl annotate "$crd" kubectl.kubernetes.io/last-applied-configuration- >/dev/null 2>&1 || true
        echo "✅ 'last-applied-configuration' annotation removed from $crd successfully"
      done
      echo "✅ 'last-applied-configuration' annotation removed from existing CRDs successfully"
      
      # Fix ArgoCD OutOfSync on CRDs regarding the attribute "priority" with default value 0 removed by Kubernetes
      echo "🔍 Fixing ArgoCD OutOfSync on CRDs regarding the attribute 'priority' with default value 0 removed by Kubernetes..."
      yq -i 'del(.. | select(tag == "!!map" and .priority == 0).priority)' "/tmp/${name}_crds.yaml"
      echo "✅ ArgoCD OutOfSync on CRDs regarding the attribute 'priority' with default value 0 removed by Kubernetes fixed successfully"

      # Apply CRDs
      echo "📋 Applying $name CRDs..."
      kubectl --server-side --force-conflicts apply -f "/tmp/${name}_crds.yaml" >/dev/null 2>&1
      echo "✅ === $name CRDs installation completed ==="
      echo
    }
  
    # Read CRDs configuration from ConfigMap
    echo "📄 Reading CRDs configuration from ConfigMap..."
    CONFIG_FILE="/etc/config/crds-installer-config.yaml"
    
    if [ ! -f "$CONFIG_FILE" ]; then
      echo "❌ Error: CRDs configuration file not found at $CONFIG_FILE"
      exit 1
    fi
    
    # Parse YAML and process each enabled entry
    echo "🔍 Parsing CRDs configuration..."
    
    # Validate YAML syntax first
    if ! yq e '.' "$CONFIG_FILE" > /dev/null 2>&1; then
      echo "❌ Error: Invalid YAML syntax in configuration file"
      exit 1
    fi
    echo "✅ Configuration file validated successfully"
    echo
    
    # Check if there are any enabled entries
    if [ ! -n "$(yq eval -r '.[] | select(.enabled == true)' "$CONFIG_FILE")" ]; then
      echo "⚠️ No CRDs to install, update, or clean up"
      exit 0
    fi
        
    # Process each enabled entry (install or delete/cleanup)
    entry_count=$(yq eval '[.[] | select(.enabled == true)] | length' "$CONFIG_FILE")
    i=0
    while [ "$i" -lt "$entry_count" ]; do
      name=$(yq eval -r "[.[] | select(.enabled == true)][$i].name" "$CONFIG_FILE")
      action=$(yq eval -r "[.[] | select(.enabled == true)][$i].action // \"install\"" "$CONFIG_FILE")
      cleanup_flag=$(yq eval -r "[.[] | select(.enabled == true)][$i].cleanup // false" "$CONFIG_FILE")
      crd_pattern=$(yq eval -r "[.[] | select(.enabled == true)][$i].crd_pattern" "$CONFIG_FILE")
      repository=$(yq eval -r "[.[] | select(.enabled == true)][$i].repository // \"\"" "$CONFIG_FILE")
      version=$(yq eval -r "[.[] | select(.enabled == true)][$i].version // \"\"" "$CONFIG_FILE")
      chart_name=$(yq eval -r "[.[] | select(.enabled == true)][$i].chart_name // \"\"" "$CONFIG_FILE")

      if [ "$action" = "delete" ] || [ "$cleanup_flag" = "true" ]; then
        # Non-fail-closed: cleanup must not block the sync if leftovers are stubborn
        cleanup_crds "$name" "$crd_pattern" || true
      else
        install_crds "$name" "$repository" "$version" "$crd_pattern" "$chart_name"
      fi

      i=$((i + 1))
    done
    
    echo "✅ All CRDs operations completed successfully!"
