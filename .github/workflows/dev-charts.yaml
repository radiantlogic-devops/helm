name: Publish dev charts (OCI)

# Publishes a throwaway, uniquely-versioned copy of every changed chart to GHCR on each push
# to a non-default branch, so a chart can be installed straight from the branch without
# cutting a release or waiting for a merge:
#
#   helm install fid oci://ghcr.io/<owner>/helm-dev/fid --version <the version printed in the summary>
#
# Nothing here touches the gh-pages release channel — dev versions are always semver
# prereleases (X.Y.Z-dev....), so `helm upgrade` and `helm search` will never pick one up
# unless it is asked for by exact version or with --devel.

on:
  push:
    branches-ignore:
      - master
      - gh-pages
    paths:
      - 'charts/**'
      - '.github/workflows/dev-charts.yaml'
  workflow_dispatch:
    inputs:
      charts:
        description: 'Charts to publish (space separated, e.g. "fid zookeeper"). Empty = all.'
        required: false
        default: ''

concurrency:
  # One publish at a time per branch; a newer push supersedes an in-flight one.
  group: dev-charts-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Charts land under ghcr.io/<owner>/helm-dev/<chart>, keeping them clearly separated
  # from anything released.
  REPO_NAMESPACE: ${{ github.repository_owner }}/helm-dev

jobs:
  detect:
    name: Detect changed charts
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.detect.outputs.charts }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.charts }}" ]; then
            SELECTED="${{ github.event.inputs.charts }}"
          else
            # Diff against the merge-base with the default branch so a long-lived branch
            # publishes everything it has changed, not just the last commit.
            BASE=$(git merge-base origin/${{ github.event.repository.default_branch }} HEAD || true)
            if [ -z "$BASE" ]; then BASE=$(git rev-parse HEAD~1 || git rev-parse HEAD); fi
            echo "comparing against $BASE"
            SELECTED=$(git diff --name-only "$BASE" HEAD -- charts/ \
              | awk -F/ '/^charts\//{print $2}' | sort -u | tr '\n' ' ')
          fi
          SELECTED=$(echo "$SELECTED" | xargs || true)
          echo "selected charts: '${SELECTED}'"
          if [ -z "$SELECTED" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "charts=[]"  >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            # shellcheck disable=SC2086  # word splitting is intentional: space separated -> one per line
            printf 'charts=%s\n' "$(printf '%s\n' $SELECTED | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: ${{ matrix.chart }}
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.detect.outputs.charts) }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Compute dev version
        id: ver
        run: |
          set -euo pipefail
          BASE_VERSION=$(helm show chart "charts/${{ matrix.chart }}" | awk '/^version:/{print $2; exit}')
          # Semver prerelease identifiers allow only [0-9A-Za-z-], dot separated.
          SLUG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9-]#-#g' | cut -c1-30 | sed 's/-*$//')
          # 'g' prefix keeps the identifier non-numeric, so a hex sha of all digits
          # cannot be read as a numeric identifier with leading zeros (invalid semver).
          SHA="g$(git rev-parse --short=8 HEAD)"
          DEV_VERSION="${BASE_VERSION}-dev.${SLUG}.${SHA}"
          echo "base=${BASE_VERSION}"       >> "$GITHUB_OUTPUT"
          echo "version=${DEV_VERSION}"     >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ matrix.chart }} as ${DEV_VERSION}"

      - name: Build dependencies
        run: |
          set -euo pipefail
          helm repo add radiantone https://radiantlogic-devops.github.io/helm
          helm repo update
          helm dependency build "charts/${{ matrix.chart }}"

      - name: Lint
        run: helm lint "charts/${{ matrix.chart }}"

      - name: Render and validate against the Kubernetes API schema
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          helm template rel "charts/${{ matrix.chart }}" > /tmp/rendered.yaml
          # `helm test` pods and CRDs from subcharts are not always in the upstream schema set;
          # -ignore-missing-schemas keeps this useful without being a false-failure machine.
          /tmp/kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.30.0 /tmp/rendered.yaml

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Package and push
        id: push
        run: |
          set -euo pipefail
          helm package "charts/${{ matrix.chart }}" \
            --version "${{ steps.ver.outputs.version }}" \
            --destination /tmp/pkg
          helm push "/tmp/pkg/${{ matrix.chart }}-${{ steps.ver.outputs.version }}.tgz" \
            "oci://${REGISTRY}/${REPO_NAMESPACE}"

      - name: Summary
        run: |
          CHART_REF="oci://${REGISTRY}/${REPO_NAMESPACE}/${{ matrix.chart }}"
          {
            echo "### \`${{ matrix.chart }}\` published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| chart version | \`${{ steps.ver.outputs.version }}\` |"
            echo "| base version | \`${{ steps.ver.outputs.base }}\` |"
            echo "| branch | \`${GITHUB_REF_NAME}\` |"
            echo "| commit | \`$(git rev-parse --short=8 HEAD)\` |"
            echo
            echo '```bash'
            echo "# private package - authenticate once per machine:"
            echo "echo \$GITHUB_TOKEN | helm registry login ghcr.io -u <your-github-username> --password-stdin"
            echo
            echo "helm upgrade --install ${{ matrix.chart }} ${CHART_REF} \\"
            echo "  --version ${{ steps.ver.outputs.version }} \\"
            echo "  -n <namespace> -f values.yaml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Prune old ${{ matrix.chart }} dev versions
    needs: [detect, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.detect.outputs.charts) }}
    steps:
      # Dev tags accumulate fast (one per push). Keep the most recent 20 per chart so a
      # branch under active development always has its history available, and let the rest go.
      # continue-on-error: pruning is housekeeping and must never fail a publish.
      - name: Prune old dev versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          owner: ${{ github.repository_owner }}
          package-type: container
          package-name: helm-dev/${{ matrix.chart }}
          min-versions-to-keep: 20
