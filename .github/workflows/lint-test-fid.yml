name: Lint and Test FID Charts

on:
  pull_request:
    paths:
      - 'charts/fid/**'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Clear any existing tool cache
        run: |
          mv "${{ runner.tool_cache }}" "${{ runner.tool_cache }}.old"
          mkdir -p "${{ runner.tool_cache }}"
          
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v1
        with:
          version: v3.9.2

      - uses: actions/setup-python@v2
        with:
          python-version: 3.9

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.3.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "::set-output name=changed::true"
          fi
          helm repo add radiantone https://radiantlogic-devops.github.io/helm

      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        uses: helm/kind-action@v1.2.0
        if: steps.list-changed.outputs.changed == 'true'
        with:
          config: .config/kind.yaml

      - name: Kind cluster-info
        run: |
          kubectl cluster-info --context kind-chart-testing
          kubectl get nodes --context kind-chart-testing

      - name: Run chart-testing (install)
        run: ct install --charts=charts/fid --helm-extra-args="--timeout=15m0s" --helm-extra-set-args="--set=fid.license=${{ secrets.RADIANTONE_LICENSE }} --set=dependencies.zookeeper.enabled=true --set=replicaCount=2 --set=postStart.enabled=false" --upgrade --debug

  # Schema + rendered-manifest validation across every supported posture.
  #
  # `helm lint` alone passes on this chart even with duplicate YAML keys and invalid API
  # objects, so it proves very little on its own. This job renders each ci/*-values.yaml
  # and validates the result against the Kubernetes API schema.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform

      - name: Build dependencies
        run: helm dependency update charts/fid

      - name: Validate values.schema.json accepts the shipped defaults
        run: helm lint charts/fid

      - name: Render and validate every posture
        run: |
          set -euo pipefail
          rc=0
          for f in charts/fid/ci/*-values.yaml; do
            name=$(basename "$f" .yaml)
            echo "::group::$name"
            if ! helm template rel charts/fid -f "$f" > "/tmp/$name.yaml"; then
              echo "render FAILED for $name"; rc=1; echo "::endgroup::"; continue
            fi
            # -strict rejects duplicate keys and unknown fields; this is what catches the
            # class of bug helm lint silently tolerates.
            if ! /tmp/kubeconform -strict -summary -ignore-missing-schemas \
                 -kubernetes-version 1.30.0 "/tmp/$name.yaml"; then
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Assert the security dial behaves
        run: |
          set -euo pipefail
          # vanilla must stay bare: no hardening keys leak into the default posture.
          helm template rel charts/fid -f charts/fid/ci/vanilla-values.yaml > /tmp/v.yaml
          if grep -q "runAsNonRoot" /tmp/v.yaml; then
            echo "vanilla profile must not set runAsNonRoot"; exit 1
          fi
          if grep -q "kind: NetworkPolicy" /tmp/v.yaml; then
            echo "vanilla profile must not render a NetworkPolicy"; exit 1
          fi
          # hardened must actually harden.
          helm template rel charts/fid -f charts/fid/ci/hardened-values.yaml > /tmp/h.yaml
          for want in "runAsNonRoot: true" "kind: NetworkPolicy" "automountServiceAccountToken: false"; do
            grep -q "$want" /tmp/h.yaml || { echo "hardened profile missing: $want"; exit 1; }
          done
          # an explicit value must beat the profile, and podSpecPatch must beat everything.
          helm template rel charts/fid -f charts/fid/ci/override-wins-values.yaml > /tmp/o.yaml
          grep -q "runAsUser: 0"        /tmp/o.yaml || { echo "explicit securityContext did not win"; exit 1; }
          grep -q "runtimeClassName: gvisor" /tmp/o.yaml || { echo "podSpecPatch did not apply"; exit 1; }
          # airgap: nothing may be pulled from outside the mirror.
          helm template rel charts/fid -f charts/fid/ci/airgap-values.yaml \
            | grep -E "^\s+image:" | grep -v "registry.internal.example.com" \
            && { echo "an image escaped global.imageRegistry"; exit 1; }
          echo "all posture assertions passed"

      - name: Preflight must reject a 7.x image with mountSecrets enabled
        run: |
          set -euo pipefail
          if helm template rel charts/fid --set image.tag=7.4.23 --set fid.mountSecrets=true >/dev/null 2>&1; then
            echo "preflight failed to reject mountSecrets on a 7.x image"; exit 1
          fi
          # ...and must be bypassable, because no check in this chart is mandatory.
          helm template rel charts/fid --set image.tag=7.4.23 --set fid.mountSecrets=true \
            --set preflight.mountSecretsVersionCheck=false >/dev/null
          echo "preflight behaves"

  # Temp Helm Chart hosted as an OCI image on ghcr.
  #
  # Mirrors the publish-ghcr job in radiantlogic-devops/helm-v8, so both repos expose a
  # throwaway chart per PR under the same convention: the chart is renamed to <chart>-dev
  # and pushed under this repository's own prefix.
  #
  #   helm pull oci://ghcr.io/radiantlogic-devops/helm/fid-dev --version <Chart.yaml version>
  #
  # The package is separate from everything helm-v8 publishes (which all live under
  # ghcr.io/radiantlogic-devops/helm-v8/) and from this repo's released charts (gh-pages,
  # via release.yml on master). Nothing here touches either.
  #
  # NOTE: the tag is the raw Chart.yaml version, exactly as helm-v8 does it, so successive
  # pushes to a PR - and concurrent PRs that do not bump the version - overwrite the same
  # tag. Pull by digest if you need a specific build pinned.
  publish-ghcr:
    # Depending on the org's default workflow permissions (contents read-only vs read-write),
    # packages: write may be required for the GITHUB_TOKEN to push to GHCR.
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout
        # v4, not helm-v8's v3: the v3 runner is too old for current GitHub runners.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Rename so the temp chart cannot be confused with the released `fid`.
      # Unlike helm-v8, the zookeeper dependency is deliberately left pointing at the
      # published gh-pages chart: this repo has no zookeeper-dev to point at, and
      # `helm dependency update` resolves that URL without a `helm repo add`.
      # Consequence: a PR that changes charts/zookeeper is NOT reflected in the dev fid
      # chart - it still pulls the last released zookeeper.
      - name: update-yaml-file
        uses: mikefarah/yq@v4.44.3
        id: update_chart
        with:
          cmd: yq -i '.name = "fid-dev"' charts/fid/Chart.yaml

      - name: read-yaml-file
        uses: mikefarah/yq@v4.44.3
        id: read_chart
        with:
          cmd: yq '.version' charts/fid/Chart.yaml

      - name: Chart | Push
        uses: appany/helm-oci-chart-releaser@v0.4.1
        with:
          name: fid-dev
          repository: helm
          tag: ${{ steps.read_chart.outputs.result }}
          registry: ghcr.io/${{ github.repository_owner }}
          path: charts/fid
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          update_dependencies: 'true' # Defaults to false

      - name: Summary
        run: |
          {
            echo "### Temp chart published"
            echo
            echo '```bash'
            echo "helm pull oci://ghcr.io/${{ github.repository_owner }}/helm/fid-dev \\"
            echo "  --version ${{ steps.read_chart.outputs.result }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
